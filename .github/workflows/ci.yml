name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
  release:
    types: [published]

env:
  MAVEN_CLI_OPTS: "-B"

jobs:
  compile:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - run: mvn $MAVEN_CLI_OPTS -U clean compile

  verify:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - jvm: OpenJDK
            distribution: temurin
            maven-args: ""
          - jvm: GraalVM
            distribution: graalvm
            maven-args: "-Ptest-guest-jit"
    name: Verify (${{ matrix.jvm }})
    steps:
      - uses: actions/checkout@v7
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips42t64 libglib2.0-0t64
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libvips.so.42 /usr/lib/x86_64-linux-gnu/libvips.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libglib-2.0.so.0 /usr/lib/x86_64-linux-gnu/libglib-2.0.so
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libgobject-2.0.so.0 /usr/lib/x86_64-linux-gnu/libgobject-2.0.so
          sudo ldconfig
      - name: Verify libvips
        run: ldconfig -p | grep libvips
      - uses: jdx/mise-action@v5
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: "25"
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Verify JVM selection
        run: |
          java -version
          mvn -version
      - run: mvn $MAVEN_CLI_OPTS verify ${{ matrix.maven-args }}
      - name: Save release JAR
        if: github.event_name == 'release' && matrix.jvm == 'OpenJDK'
        uses: actions/upload-artifact@v7
        with:
          name: release-jar
          path: |
            target/wolpi-*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-jar
          path: release-assets
      - name: Attach JAR to GitHub release
        run: gh release upload "$RELEASE_TAG" release-assets/*.jar --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  docker-snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  docker-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository }}:latest
